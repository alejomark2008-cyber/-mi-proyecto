<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ArCompra | Compara precios</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1e293b;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #16a34a);
      color: white;
      padding: 25px 18px 55px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.95;
      line-height: 1.5;
    }

    .buscador {
      width: 90%;
      max-width: 550px;
      margin: -28px auto 25px;
      background: white;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      display: flex;
    }

    .buscador input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px;
      font-size: 16px;
      background: transparent;
    }

    .buscador button {
      border: none;
      background: #16a34a;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: auto;
      padding-bottom: 40px;
    }

    .titulo {
      text-align: center;
      margin: 25px 0 18px;
    }

    .titulo h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .titulo p {
      color: #64748b;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .producto {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      border: 2px solid transparent;
    }

    .producto:hover {
      border-color: #22c55e;
    }

    .icono {
      font-size: 45px;
      text-align: center;
      margin-bottom: 12px;
    }

    .producto h3 {
      text-align: center;
      margin-bottom: 15px;
    }

    .precio {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .precio:last-child {
      border-bottom: none;
    }

    .barato {
      color: #16a34a;
      font-weight: bold;
    }

    .ahorro {
      margin-top: 12px;
      padding: 10px;
      text-align: center;
      background: #dcfce7;
      color: #166534;
      border-radius: 10px;
      font-weight: bold;
    }

    .info {
      margin-top: 30px;
      background: #e0f2fe;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
    }

    .info h2 {
      margin-bottom: 10px;
    }

    .info p {
      line-height: 1.6;
      color: #334155;
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 25px;
    }

    footer p {
      opacity: 0.8;
      margin-top: 6px;
    }

    @media (max-width: 500px) {
      .buscador {
        width: 94%;
      }

      .buscador button {
        padding: 10px 13px;
      }

      .logo {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🛒 ArCompra</div>

    <p>
      Compara precios entre supermercados<br>
      y encuentra dónde comprar más barato.
    </p>
  </header>

  <div class="buscador">
    <input
      type="text"
      id="buscar"
      placeholder="Busca un producto..."
    >

    <button onclick="buscarProducto()">
      Buscar
    </button>
  </div>

  <main>

    <section class="titulo">
      <h2>Productos populares</h2>

      <p>
        Compara precios en D1, Ara y OXXO.
      </p>
    </section>

    <section class="productos">

      <article class="producto">
        <div class="icono">🥛</div>

        <h3>Leche</h3>

        <div class="precio">
          <span>D1</span>
          <strong class="barato">$4.200</strong>
        </div>

        <div class="precio">
          <span>Ara</span>
          <strong>$4.500</strong>
        </div>

        <div class="precio">
          <span>OXXO</span>
          <strong>$5.200</strong>
        </div>

        <div class="ahorro">
          Mejor precio: D1
        </div>
      </article>


      <article class="producto">
        <div class="icono">🍚</div>

        <h3>Arroz</h3>

        <div class="precio">
          <span>D1</span>
          <strong>$5.000</strong>
        </div>
